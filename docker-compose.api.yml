services:
  gemerotic-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemerotic/api:latest
    container_name: gemerotic-api
    env_file:
      - .env
    network_mode: host
    pid: host
    privileged: true
    depends_on:
      gemerotic-postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./var:/app/var

  gemerotic-worker:
    image: gemerotic/api:latest
    container_name: gemerotic-worker
    env_file:
      - .env
    network_mode: host
    pid: host
    privileged: true
    depends_on:
      gemerotic-postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - app.worker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./var:/app/var

  gemerotic-postgres:
    image: docker.io/postgres:18-alpine
    container_name: gemerotic-postgres
    environment:
      POSTGRES_DB: ${GEMEROTIC_POSTGRES_DB:-gemerotic}
      POSTGRES_USER: ${GEMEROTIC_POSTGRES_USER:-gemerotic}
      POSTGRES_PASSWORD: ${GEMEROTIC_POSTGRES_PASSWORD:-gemerotic-dev-password}
    ports:
      - "127.0.0.1:${GEMEROTIC_POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -q -t 5 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - gemerotic-postgres-data:/var/lib/postgresql:rw

  gemerotic-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: gemerotic/ui:latest
    container_name: gemerotic-ui
    depends_on:
      - gemerotic-api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  gemerotic-postgres-data:
    driver: local
