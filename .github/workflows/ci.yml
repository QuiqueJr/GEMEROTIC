name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint backend
        run: ruff check .

      - name: Import FastAPI application
        run: python -c "from app.main import create_app; app = create_app(); print(f'{app.title} - OK')"

      - name: Run unit tests
        run: pytest tests/ -v

  netbox-compose:
    name: NetBox Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render NetBox env files
        run: ./scripts/render_netbox_env.sh --force

      - name: Validate Docker Compose file
        working-directory: docker/netbox
        run: docker compose config >/dev/null

  netbox-stack:
    name: NetBox Stack Smoke
    runs-on: ubuntu-latest
    needs:
      - netbox-compose
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render NetBox env files
        run: ./scripts/render_netbox_env.sh --force

      - name: Build and start NetBox stack
        working-directory: docker/netbox
        run: docker compose up -d --build

      - name: Wait for NetBox login page
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/login/ >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "NetBox did not become ready in time" >&2
          exit 1

      - name: Verify OT Security plugin API
        run: |
          token_json="$(curl -fsS \
            -X POST http://localhost:8080/api/users/tokens/provision/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"gemerotic-admin","password":"netbox-admin-password"}')"
          export NETBOX_BEARER_TOKEN="$(TOKEN_JSON="${token_json}" python - <<'PY'
import json
import os

payload = json.loads(os.environ["TOKEN_JSON"])
print(f"nbt_{payload['key']}.{payload['token']}")
PY
          )"
          curl -fsS \
            -H "Authorization: Bearer ${NETBOX_BEARER_TOKEN}" \
            http://localhost:8080/api/plugins/installed-plugins/ >/tmp/installed-plugins.json
          grep -q "netbox_ot_security" /tmp/installed-plugins.json
          curl -fsS \
            -H "Authorization: Bearer ${NETBOX_BEARER_TOKEN}" \
            http://localhost:8080/api/plugins/ot-security/security-zones/ >/tmp/security-zones.json

      - name: Show container status
        if: always()
        working-directory: docker/netbox
        run: docker compose ps

      - name: Stop NetBox stack
        if: always()
        working-directory: docker/netbox
        run: docker compose down -v
