name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  BUN_VERSION: "1.3.9"

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint backend
        run: ruff check .

      - name: Import FastAPI application
        run: python -c "from app.main import create_app; app = create_app(); print(f'{app.title} - OK')"

      - name: Run unit tests
        run: pytest tests/ -v

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: ui
        run: bun ci

      - name: Lint frontend
        working-directory: ui
        run: bun run lint

      - name: Run frontend tests
        working-directory: ui
        run: bun run test:run

      - name: Build frontend
        working-directory: ui
        run: bun run build

  netbox-compose:
    name: NetBox Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Render NetBox env files
        run: ./scripts/render_netbox_env.sh --force

      - name: Validate Docker Compose file
        working-directory: docker/netbox
        run: docker compose config >/dev/null

  netbox-stack:
    name: NetBox Stack Smoke
    runs-on: ubuntu-latest
    needs:
      - netbox-compose
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Render NetBox env files
        run: ./scripts/render_netbox_env.sh --force

      - name: Build and start NetBox stack
        working-directory: docker/netbox
        run: docker compose up -d --build

      - name: Wait for NetBox login page
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/login/ >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "NetBox did not become ready in time" >&2
          exit 1

      - name: Provision NetBox API token
        id: netbox-token
        run: |
          token_json="$(curl -fsS \
            -X POST http://localhost:8080/api/users/tokens/provision/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"gemerotic-admin","password":"netbox-admin-password"}')"
          bearer_token="$(
            TOKEN_JSON="${token_json}" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["TOKEN_JSON"])
          print("nbt_" + payload["key"] + "." + payload["token"])
          PY
          )"
          echo "token=${bearer_token}" >> "${GITHUB_OUTPUT}"

      - name: Verify OT Security plugin API
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ steps.netbox-token.outputs.token }}" \
            http://localhost:8080/api/plugins/installed-plugins/ >/tmp/installed-plugins.json
          grep -q "netbox_ot_security" /tmp/installed-plugins.json
          curl -fsS \
            -H "Authorization: Bearer ${{ steps.netbox-token.outputs.token }}" \
            http://localhost:8080/api/plugins/ot-security/security-zones/ >/tmp/security-zones.json

      - name: Verify shared rate limit store
        run: |
          docker exec gemerotic-rate-limit-store sh -lc \
            'valkey-cli --pass "$REDIS_PASSWORD" ping | grep -q PONG'

      - name: Smoke shared rate limit through FastAPI
        env:
          API_KEY: ci-rate-limit-key
          NETBOX_TOKEN: ${{ steps.netbox-token.outputs.token }}
          NETBOX_URL: http://localhost:8080
          NETBOX_TIMEOUT_SECONDS: "10.0"
          NETBOX_VERIFY_SSL: "true"
          RATE_LIMIT_ENABLED: "true"
          RATE_LIMIT_MAX_REQUESTS: "1"
          RATE_LIMIT_WINDOW_SECONDS: "60"
          RATE_LIMIT_REDIS_URL: redis://:gemerotic-rate-limit-password@localhost:6380/0
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from app.main import create_app

          with TestClient(create_app()) as client:
              health = client.get("/api/v1/health")
              first = client.post(
                  "/api/v1/netbox/bootstrap",
                  headers={"X-API-Key": "ci-rate-limit-key"},
              )
              second = client.post(
                  "/api/v1/netbox/bootstrap",
                  headers={"X-API-Key": "ci-rate-limit-key"},
              )

          assert health.status_code == 200
          assert health.json()["checks"]["rate_limit_backend_connected"] is True
          assert first.status_code == 200
          assert second.status_code == 429
          PY

      - name: Show container status
        if: always()
        working-directory: docker/netbox
        run: docker compose ps

      - name: Stop NetBox stack
        if: always()
        working-directory: docker/netbox
        run: docker compose down -v
